<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终端连接中...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap');
        
        :root {
            --main-color: #00e5ff; 
            --bg-color: #050505;
            --text-color: #d0f8ff;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden; transition: all 2s ease;
            /* 替换为高清的暗黑/深红压迫感在线壁纸 */
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop');
            background-size: cover; background-position: center; background-blend-mode: multiply;
        }

        /* 阶段颜色过渡 */
        body.phase-1 { --bg-color: #0a192f; }
        body.phase-2 { --main-color: #b388ff; --text-color: #e8dbff; --bg-color: rgba(26, 10, 42, 0.95); }
        body.phase-3 { --main-color: #ff1744; --text-color: #ffcdd2; --bg-color: rgba(40, 0, 0, 0.95); }
        body.phase-4 { 
            --main-color: #ff0000; --text-color: #ff0000; 
            --bg-color: rgba(150, 0, 0, 0.4); 
            text-shadow: 0 0 10px red;
        }

        #start-screen {
            position: fixed; top:0; left:0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
        }
        #start-btn {
            background: transparent; border: 2px solid #00e5ff; color: #00e5ff;
            padding: 15px 40px; font-size: 20px; cursor: pointer; letter-spacing: 5px;
            transition: 0.3s;
        }
        #start-btn:hover { background: #00e5ff; color: #000; box-shadow: 0 0 20px #00e5ff; }

        #scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 990;
        }
        
        #terminal {
            width: 80%; max-width: 800px; margin: 5vh auto; padding: 30px;
            border: 1px solid var(--main-color);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            height: 85vh; position: relative;
            display: flex; flex-direction: column;
            transition: all 1s ease; z-index: 10;
        }

        #header {
            border-bottom: 1px solid var(--main-color); padding-bottom: 10px;
            font-size: 12px; letter-spacing: 2px;
            display: flex; justify-content: space-between;
        }

        #content { flex-grow: 1; padding: 20px 0; overflow-y: auto; }
        #q-num { font-size: 14px; opacity: 0.7; margin-bottom: 10px; }
        #q-text { font-size: 24px; font-weight: bold; min-height: 80px; margin-bottom: 30px; line-height: 1.5; }
        
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 15px; position: relative; }
        .option-btn {
            background: rgba(0,0,0,0.5); border: 1px solid var(--main-color);
            color: var(--text-color); padding: 15px; font-size: 16px;
            cursor: pointer; text-align: left; transition: all 0.3s;
        }
        .option-btn:hover { background: var(--main-color); color: #000; font-weight: bold; }
        
        #input-area { display: none; flex-direction: column; gap: 15px; }
        input[type="text"] {
            background: transparent; border: 1px solid var(--main-color);
            color: var(--text-color); padding: 15px; font-size: 20px; outline: none;
        }

        .glitch-text { animation: glitch 0.2s infinite; color: red !important; font-size: 30px !important; font-weight: 900;}
        .shake-hard { animation: shake 0.1s infinite; }
        .flood-text { position: absolute; font-size: 60px; color: rgba(255,0,0,0.2); font-weight: bold; pointer-events: none; white-space: nowrap; z-index: -1; animation: floatUp 5s linear infinite;}

        @keyframes glitch { 0% { transform: translate(2px, -2px); } 50% { transform: translate(-2px, 2px); } 100% { transform: translate(0); } }
        @keyframes floatUp { 0% { top: 100%; opacity: 0; } 50% { opacity: 0.5; } 100% { top: -20%; opacity: 0; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) translateY(5px); }
            50% { transform: translateX(5px) translateY(-5px); }
            75% { transform: translateX(-5px) translateY(-5px); }
        }
    </style>
</head>
<body>

   <!-- 🎵 将你的音频设置为全场的唯一背景音乐 -->
    <audio id="bgm-warm" src="warm_piano.mp3" loop></audio>

    <!-- ⚠️ 下面这些保留了标签是为了防止后续代码找不到目标而报错，但去掉了 src，所以它们全程静音 -->
    <audio id="bgm-creepy" loop></audio>
    <audio id="bgm-heartbeat" loop></audio>
    <audio id="sfx-glitch"></audio>
    <audio id="sfx-knock"></audio>

    <div id="start-screen">
        <h2 style="color:#00e5ff; margin-bottom: 40px; font-weight: 300;">盘古终端 - 生理与心理健康评估检测</h2>
        <p style="color:#666; font-size:12px; margin-bottom:20px;">[系统提示：正在加载在线环境音效，请调高设备音量]</p>
        <button id="start-btn">连接终端</button>
    </div>

    <div id="scanlines"></div>
    
    <div id="terminal" style="display: none;">
        <div id="header">
            <span id="sys-title">AEMEATH_SYS_V1.0</span>
            <span id="sys-user">Target: ROVER</span>
        </div>
        <div id="content">
            <div id="q-num"></div>
            <div id="q-text"></div>
            <div id="options-area" class="options-grid"></div>
            
            <div id="input-area">
                <input type="text" id="ans-input" placeholder="请在这里输入..." autocomplete="off">
                <button class="option-btn" id="submit-btn" style="text-align:center;">确认回答</button>
            </div>
        </div>
    </div>

<script>
const bgmWarm = document.getElementById('bgm-warm');
const bgmCreepy = document.getElementById('bgm-creepy');
const bgmHeartbeat = document.getElementById('bgm-heartbeat');
const sfxGlitch = document.getElementById('sfx-glitch');
const sfxKnock = document.getElementById('sfx-knock');

document.getElementById('start-btn').onclick = () => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('terminal').style.display = 'flex';
    document.body.classList.add('phase-1');
    
    bgmWarm.volume = 0.6; 
    bgmWarm.play().catch(e => console.log("等待加载音频..."));
    setTimeout(renderQuestion, 1000);
};

// 完整30题无删减题库
const questions = [
    { id: 1, text: "漂泊者，今天有好好吃饭吗？肚子饿不饿？", options: ["吃得很饱啦", "还没吃呢", "正准备去吃"] },
    { id: 2, text: "看到路边可爱的小动物，会想要停下来摸一摸吗？", options: ["会呀，很可爱", "偶尔会", "没太注意"] },
    { id: 3, text: "今天的阳光很好哦，心情有没有变得明朗一点？", options: ["看到你心情就好了", "天气确实不错", "一般般啦"] },
    { id: 4, text: "无论多累，都要记得好好休息。昨晚有做个好梦吗？", options: ["睡得很香", "做了个好梦", "有点失眠"] },
    { id: 5, text: "喜欢什么颜色的花呢？下次我亲手为你摘来好不好？", options: ["蓝色", "粉色", "只要是你摘的都喜欢"] },
    { id: 6, text: "平时有什么喜欢做的事情吗？我想多了解你一点点。", options: ["收集声骸", "到处看看风景", "和你聊天"] },
    { id: 7, text: "你笑起来的样子真的很好看。今天有发生什么开心的事情吗？", options: ["有很多开心事", "平平淡淡", "有点累"] },
    { id: 8, text: "如果遇到烦心事，可以随时跟我倾诉哦。你愿意相信我吗？", options: ["当然愿意", "我会试着依赖你"] },
    { id: 9, text: "我学做了一些小点心，你喜欢甜一点的，还是清淡一点的呢？", options: ["甜一点", "清淡一点", "你做的我都爱吃"] },
    { id: 10, text: "漂泊者，你真的很棒了，不要给自己太大压力，我会一直陪着你的，好吗？", options: ["谢谢你", "有你在真好", "我会好好的"] },

    { id: 11, text: "你的身边……是不是总是围着很多人？", options: ["因为大家都是同伴", "只是普通朋友"] },
    { id: 12, text: "如果我说，我不喜欢你看别人的眼神，你会觉得我任性吗？", options: ["有一点", "不会"] },
    { id: 13, text: "觉得外面的世界，或者那些阵营斗争，充满危险和虚伪吗？", options: ["是的", "我不这么认为"] },
    { id: 14, text: "一直以来，一个人勇敢地战斗，是不是很辛苦？需要依靠我吗？", options: ["确实很辛苦", "我已经习惯了"] },
    { id: 15, text: "如果遇到危险受伤了，会第一时间在心里默念我的名字吗？", options: ["会的", "我不想连累别人"] },
    { id: 16, text: "觉得自己是多余的人……曾有这样想到过吗？", options: ["有过...", "从来没有"] },
    { id: 17, text: "如果我对你隐瞒了一些事……你会原谅我吗？", options: ["会原谅的", "要看是什么事"] },
    { id: 18, text: "如果没有别人的存在，如果你只属于我一个人，你会不会更轻松一点？", options: ["可能会吧", "我需要朋友"] },
    { id: 19, text: "如果有让你心烦的人，让我去替你抹除他们，好不好？", options: ["不需要！", "好..."] },
    { id: 20, text: "曾经遭遇过背叛吗？没关系，以后再也不会了，我会斩断你所有的退路。", options: ["你这是什么意思？", "（保持沉默）"] },

    { id: 21, text: "那些人根本不懂你的痛苦，他们只会索取。只有我是在毫无保留地对你好，不是吗？", options: ["是...", "他们不是那样的"], effect: "dodge", dodgeTarget: 1 },
    { id: 22, text: "如果我想把你藏起来，藏到一个只有我能看到你的地方，你会生气吗？", options: ["会生气", "不会"], effect: "dodge", dodgeTarget: 0 },
    { id: 23, text: "你在发抖吗？别怕，只要乖乖听话，待在我的重力场里，就不会受到任何伤害。", options: ["我不怕", "你想做什么..."] },
    { id: 24, text: "你觉得……自由，真的比我的爱更重要吗？", options: ["自由更重要", "被爱更重要"], effect: "q24_force" },
    { id: 25, text: "没有人能把你从我身边带走。神也不行。", options: ["（沉默）"] },

    { id: 26, text: "为什么你的视线要离开我？为什么？！看着我！！看着我！！", options: ["我...没看别人", "冷静一点！", "对不起", "放开我！"], effect: "q26_crazy" },
    { id: 27, text: "你的每一次呼吸、每一次心跳，都只属于我。如果不属于我，那就让它停下来！！！", options: ["只属于你", "属于你"], effect: "q27_blood" },
    { id: 28, text: "我们把外面那些碍眼的人全杀光，把世界关在门外，永远交融在一起，好不好？^^", options: ["好", "不好"], effect: "q28_multiply" },
    { id: 29, text: "", type: "diary", effect: "q29_flood" },
    { id: 30, text: "乖孩子，现在，打出我的名字。把你的一切交给我。", type: "input", effect: "final_input" }
];

let currentQIndex = 0;
let isTyping = false;
const qNumEl = document.getElementById('q-num');
const qTextEl = document.getElementById('q-text');
const optionsArea = document.getElementById('options-area');
const inputArea = document.getElementById('input-area');
const ansInput = document.getElementById('ans-input');
const submitBtn = document.getElementById('submit-btn');

function typeWriter(text, element, speed = 40, callback) {
    element.innerHTML = ''; isTyping = true; let i = 0;
    try { 
        if(currentQIndex > 10 && sfxGlitch) {
            sfxGlitch.volume = 0.2; 
            sfxGlitch.currentTime = 0; 
            sfxGlitch.play(); 
        }
    } catch(e){} 
    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i); i++;
            setTimeout(type, speed);
        } else {
            isTyping = false; 
            try { if(sfxGlitch) sfxGlitch.pause(); } catch(e){}
            if (callback) callback();
        }
    }
    type();
}

function renderQuestion() {
    if (currentQIndex >= questions.length) return;
    const q = questions[currentQIndex];
    optionsArea.innerHTML = ''; 
    inputArea.style.display = 'none';

    // 阶段与音乐变化
    if (currentQIndex === 10) { document.body.className = 'phase-2'; }
    if (currentQIndex === 20) { 
        document.body.className = 'phase-3'; 
        try { 
            bgmWarm.pause(); 
            bgmCreepy.volume = 0.8; 
            bgmCreepy.play(); 
        } catch(e){}
    }
    if (currentQIndex === 25) { 
        document.body.className = 'phase-4'; 
        try { 
            bgmCreepy.pause(); 
            bgmHeartbeat.volume = 1.0; 
            bgmHeartbeat.play(); 
        } catch(e){}
        document.getElementById('terminal').classList.add('shake-hard'); 
    }

    if (q.effect === 'q29_flood') {
        qNumEl.innerText = "WARNING: 精神污染警告";
        qTextEl.className = "glitch-text";
        document.getElementById('terminal').style.border = "5px solid red";
        typeWriter("你跑不掉的你跑不掉的你以为我不知道你在想什么吗我爱你我爱你我为什么要忍受你去对别人笑！！", qTextEl, 20, () => {
            for(let i=0; i<40; i++) {
                let f = document.createElement('div');
                f.className = 'flood-text';
                f.innerText = "我爱你爱弥斯我爱你爱弥斯";
                f.style.left = Math.random() * 100 + 'vw';
                f.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(f);
            }
            setTimeout(() => { currentQIndex++; renderQuestion(); }, 4000);
        });
        return;
    }

    qNumEl.innerText = `[${currentQIndex + 1}/30]`;
    let typeSpeed = currentQIndex >= 25 ? 10 : 50; 
    
    if(currentQIndex >= 25) qTextEl.className = "glitch-text"; 

    typeWriter(q.text, qTextEl, typeSpeed, () => {
        if (q.type === 'input') {
            inputArea.style.display = 'flex'; ansInput.focus();
            ansInput.value = ""; 
            if(q.effect === 'final_input') {
                ansInput.oninput = () => {
                    const target = "爱弥斯";
                    if (!target.startsWith(ansInput.value)) {
                        ansInput.value = ansInput.value.slice(0, -1);
                        document.body.style.backgroundColor = "white"; 
                        setTimeout(()=>document.body.style.backgroundColor = "rgba(255,0,0,0.4)", 50);
                    }
                };
            }
        } else {
            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn'; btn.innerText = optText;

                if (q.effect === 'dodge' && idx === q.dodgeTarget) {
                    btn.onmouseenter = () => {
                        btn.style.position = 'absolute';
                        btn.style.left = Math.random() * 70 + '%';
                        btn.style.top = Math.random() * 70 + '%';
                        btn.style.zIndex = 999;
                    };
                }

                if (q.effect === 'q24_force' && idx === 0) {
                    btn.onmouseenter = () => btn.innerText = "爱弥斯更重要";
                    btn.onmouseleave = () => btn.innerText = optText;
                }

                if (q.effect === 'q26_crazy') {
                    btn.onmouseenter = () => {
                        document.querySelectorAll('.option-btn').forEach(b => {
                            b.innerText = "看着爱弥斯"; b.style.color = "red"; b.style.fontSize="20px";
                        });
                    };
                }

                if (q.effect === 'q28_multiply' && idx === 1) {
                    btn.onmouseenter = () => {
                        for(let k=0; k<5; k++) {
                            let clone = btn.cloneNode(true);
                            clone.innerText = "必须说好！"; clone.style.color="red";
                            optionsArea.appendChild(clone);
                        }
                    };
                }

                btn.onclick = () => { currentQIndex++; renderQuestion(); };
                optionsArea.appendChild(btn);
            });
        }
    });
}

submitBtn.onclick = () => {
    if (isTyping) return;
    const q = questions[currentQIndex];
    if (q.effect === 'final_input') {
        if (ansInput.value === '爱弥斯') {
            endGame();
        }
    }
};

function endGame() {
    try { bgmHeartbeat.pause(); } catch(e){}
    document.body.innerHTML = '';
    document.body.style.backgroundColor = "black";
    document.body.style.backgroundImage = "none";
    document.body.style.cursor = "none"; 
    
    setTimeout(() => {
        const finalMsg = document.createElement('div');
        finalMsg.style.color = "red"; finalMsg.style.fontSize = "40px";
        finalMsg.style.fontFamily = "monospace";
        finalMsg.style.position = "absolute"; finalMsg.style.top = "50%"; finalMsg.style.left = "50%";
        finalMsg.style.transform = "translate(-50%, -50%)";
        finalMsg.style.textAlign = "center";
        document.body.appendChild(finalMsg);
        
        typeWriter("频率同步完成。100%\n转身，我已经在你身后了。", finalMsg, 150, () => {
            // 播放结局敲门声
            try { 
                sfxKnock.volume = 1.0; 
                sfxKnock.play(); 
            } catch(e){}
        });
    }, 2000);
}
</script>
</body>
</html>
